<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Joyería Artesanos · En mantenimiento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      background: radial-gradient(ellipse at top, #1a140c 0%, #0a0807 60%);
      color: #f2ecdf;
      font-family: 'Jost', system-ui, sans-serif;
      text-align: center;
    }
    main { max-width: 520px; }
    img { width: 200px; max-width: 60vw; height: auto; margin: 0 auto 32px; display: block; }
    .linea {
      width: 72px; height: 1px; margin: 0 auto 28px;
      background: linear-gradient(90deg, transparent, #c9a24b, transparent);
    }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 500;
      font-size: clamp(30px, 6vw, 44px);
      line-height: 1.15;
      background: linear-gradient(120deg, #f3dca0, #c9a24b);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 18px;
    }
    p { font-weight: 300; font-size: 16px; line-height: 1.7; color: #d7d7d7; }
  </style>
</head>
<body>
  <main>
    <img src="/public/web/uploads/logo2.PNG" alt="Joyería Artesanos">
    <div class="linea"></div>
    <h1>Estamos renovando nuestro sitio</h1>
    <p>Volvemos muy pronto con novedades. Gracias por tu paciencia.</p>
  </main>
</body>
</html>
